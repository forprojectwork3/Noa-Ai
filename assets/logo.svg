<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Noa Ai logo">
  <defs>
    <filter id="violetGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <image href="/assets/logo.png" xlink:href="/assets/logo.png" x="6" y="6" width="108" height="108" preserveAspectRatio="xMidYMid meet" filter="url(#violetGlow)"/>
</svg>
