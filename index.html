  <!-- ── Safety-net: redirect old Supabase email links BEFORE any JS loads ──
       Any URL that contains auth tokens or Supabase callback params is
       immediately redirected to /verify or /reset (preserving search + hash).
       This tiny inline script has NO dependencies and runs synchronously.
  ── -->
  <script>
    (function () {
      var s = location.search;
      var h = location.hash;
      var combined = s + h;
      if (
        combined.indexOf('access_token')     > -1 ||
        combined.indexOf('refresh_token')    > -1 ||
        combined.indexOf('code=')            > -1 ||
        combined.indexOf('token_hash')       > -1 ||
        combined.indexOf('type=signup')      > -1 ||
        combined.indexOf('type=recovery')    > -1 ||
        combined.indexOf('type=email_change')> -1 ||
        combined.indexOf('error_description')> -1
      ) {
        var dest = (combined.indexOf('type=recovery') > -1) ? '/reset' : '/email-verify';
        location.replace(dest + s + h);
      }
    })();
  </script>
