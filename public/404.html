<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Noa Ai</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07050D;
      --primary: #A855F7;
      --primary-end: #7C3AED;
      --gold: #FFD21F;
      --text: #F5F3FF;
      --muted: #9A94B3;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(circle at 30% 20%, rgba(168,85,247,0.18) 0%, transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(124,58,237,0.12) 0%, transparent 45%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 520px; }
    .logo {
      width: 72px; height: 72px;
      margin: 0 auto 2rem;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    .code {
      font-size: clamp(5rem, 15vw, 8rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--primary), var(--primary-end));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -4px;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--muted);
      font-size: 0.9375rem;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 2rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-end));
      border-radius: 999px;
      color: #fff;
      font-size: 0.9375rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(124,58,237,0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(168,85,247,0.55);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/assets/logo.svg" alt="Noa Ai logo" class="logo" width="72" height="72" />
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.<br>Head back to start learning with Noa Ai.</p>
    <a href="/" class="btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12L12 3l9 9"/><path d="M12 3v18"/></svg>
      Go Home
    </a>
  </div>
</body>
</html>
