<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Noa Ai logo">
  <defs>
    <!-- Violet gradient for hex body -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B11FF"/>
    </linearGradient>

    <!-- Inner glow radial -->
    <radialGradient id="innerGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer glow filter -->
    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gold text glow -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip path: flat-top hexagon -->
    <clipPath id="hexClip">
      <polygon points="60,6 111,33 111,87 60,114 9,87 9,33"/>
    </clipPath>
  </defs>

  <!-- Subtle outer glow ring -->
  <polygon
    points="60,4 113,32 113,88 60,116 7,88 7,32"
    fill="none"
    stroke="#A855F7"
    stroke-width="1.5"
    opacity="0.35"
    filter="url(#outerGlow)"
  />

  <!-- Main hexagon body -->
  <polygon
    points="60,8 109,34 109,86 60,112 11,86 11,34"
    fill="url(#hexGrad)"
    filter="url(#outerGlow)"
  />

  <!-- Inner highlight overlay -->
  <polygon
    points="60,8 109,34 109,86 60,112 11,86 11,34"
    fill="url(#innerGlow)"
    clip-path="url(#hexClip)"
  />

  <!-- Top shimmer line -->
  <line x1="30" y1="21" x2="90" y2="21" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round" clip-path="url(#hexClip)"/>

  <!-- Gold "N" letter -->
  <text
    x="60"
    y="77"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif"
    font-size="56"
    font-weight="800"
    fill="#FFD21F"
    filter="url(#goldGlow)"
    letter-spacing="-2"
  >N</text>
</svg>
