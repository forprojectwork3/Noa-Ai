<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting — Noa Ai</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <script>
    (function() {
      var target = '/email-verify' + window.location.search + window.location.hash;
      window.location.replace(target);
    })();
  </script>
</head>
<body style="margin:0; background:#07050D; color:#f5f3ff; font-family:'Plus Jakarta Sans',sans-serif; display:flex; align-items:center; justify-content:center; height:100vh;">
  <div style="text-align:center;">
    <div style="width:36px; height:36px; border:3px solid rgba(168,85,247,0.2); border-top-color:#a855f7; border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 16px;"></div>
    <p style="font-size:14px; color:#9a94b3;">Redirecting to secure verification...</p>
  </div>
  <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</body>
</html>
